server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name serverweather.me www.serverweather.me staging.serverweather.me admin.serverweather.me;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name serverweather.me www.serverweather.me;
    ssl_certificate     /etc/ssl/certs/serverweather-fullchain.crt;
    ssl_certificate_key /etc/ssl/private/serverweather.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name staging.serverweather.me;
    ssl_certificate     /etc/ssl/certs/staging-fullchain.crt;
    ssl_certificate_key /etc/ssl/private/staging.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name admin.serverweather.me;
    ssl_certificate     /etc/ssl/certs/admin-fullchain.crt;
    ssl_certificate_key /etc/ssl/private/admin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location / {
        proxy_pass http://127.0.0.1:3000;   # change when the admin page exists
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
